<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해리야 할래말래</title>
    <link rel="icon" href="logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body { background-color: #2c2c2c; color: #e0e0e0; font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; }
        h1.site-title { font-family: 'Jua', 'Pretendard Variable', sans-serif; font-size: 2.8rem; letter-spacing: 0; }
        .container-wide { max-width: 1500px; }
        .col-title { min-width: 170px; word-break: keep-all; }
        .game-info { min-width: 300px; }
        .meta-cell { min-width: 110px; max-width: 170px; font-size: 0.85rem; line-height: 1.5; word-break: keep-all; }
        .meta-cell > div + div { margin-top: 2px; }
        .price-cell { min-width: 110px; max-width: 190px; word-break: keep-all; }
        .meta-cell .meta-label { color: #999; font-size: 0.72rem; margin-right: 4px; }
        .card { background-color: #ff9b9b; border: 1px solid #333; color: #2c2c2c; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .table-responsive { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .table { background-color: #fff; margin-bottom: 0; }
        .table thead { background-color: #1a1a1a; color: white; border-bottom: 2px solid #ff4d4d; }
        .table thead th { font-weight: 700; padding: 15px; white-space: nowrap; }
        .table tbody tr { background-color: white; color: #333; transition: background-color 0.2s; }
        .table-hover tbody tr:hover { background-color: #f1f1f1 !important; }
        a.game-title { color: #000000 !important; text-decoration: none; font-weight: 700; font-size: 1.05rem; }
        a.game-title:hover { text-decoration: underline; color: #ff4d4d !important; }
        .btn-primary { background-color: #ff4d4d; border: none; color: white; font-weight: 700; }
        .btn-primary:hover { background-color: #e60000; }
        .btn-outline-warning { color: #2c2c2c; border-color: #2c2c2c; font-weight: 700; }
        .btn-outline-warning:hover { background-color: #2c2c2c; color: #ff9b9b; }
        .form-select-custom { font-size: 0.85rem; padding: 0.25rem 2rem 0.25rem 0.5rem; border: 1px solid #ced4da; background-color: #fff; color: #333; border-radius: 6px; min-width: 110px; }
        .select-halgame { background-color: #ff4d4d !important; color: white !important; font-weight: 700; border-color: #cc0000; }
        .select-keep { background-color: #4da6ff !important; color: white !important; font-weight: 700; border-color: #0066cc; }
        .select-coop { background-color: #9b59b6 !important; color: white !important; font-weight: 700; border-color: #8e44ad; }
        .select-finished { background-color: #6c757d !important; color: white !important; font-weight: 700; border-color: #5a6268; }
        .steam-img-container { width: 120px; height: 56px; overflow: hidden; border-radius: 6px; background-color: #1a1a1a; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .steam-thumbnail { width: 100%; height: auto; object-fit: cover; }
        .discount-badge { background-color: #4c6b22; color: #a4d007; font-weight: 700; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; margin-left: 5px; }
        .review-badge { font-weight: 700; padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; white-space: nowrap; display: inline-block; }
        .review-overwhelmingly-positive { background-color: #1a9fff; color: #fff; }
        .review-very-positive { background-color: #66c0f4; color: #000; }
        .review-positive { background-color: #66c0f4; color: #000; }
        .review-mostly-positive { background-color: #a8d4e6; color: #000; }
        .review-mixed { background-color: #b9a074; color: #000; }
        .review-mostly-negative { background-color: #c67a52; color: #fff; }
        .review-negative { background-color: #a34827; color: #fff; }
        .review-very-negative { background-color: #8b0000; color: #fff; }
        .review-overwhelmingly-negative { background-color: #5c0000; color: #fff; }
        .sync-status { font-size: 0.8rem; }
        .steam-img-container.has-trailer { cursor: zoom-in; transition: transform 0.2s, box-shadow 0.2s; }
        .steam-img-container.has-trailer:hover { transform: scale(1.05); box-shadow: 0 0 0 2px #ff4d4d, 0 4px 12px rgba(0,0,0,0.4); }
        .trailer-preview { position: fixed; z-index: 1050; width: min(480px, calc(100vw - 32px)); aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 2px #ff4d4d; pointer-events: none; opacity: 0; transform: scale(0.85); transition: opacity 0.18s ease-out, transform 0.18s ease-out; }
        .trailer-preview.show { opacity: 1; transform: scale(1); }
        .trailer-preview video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .trailer-preview .trailer-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.65); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
        #liveStatus { font-size: 0.85rem; min-height: 1.2em; }
        .genre-badge { display: inline-block; background: #2c2c2c; color: #fff; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin: 4px 4px 0 0; }
        .gp-cell { text-align: center; min-width: 96px; }
        .gp-mark { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
        .gp-logo { display: inline-flex; align-items: center; gap: 5px; background: #107c10; color: #fff; font-weight: 800; font-size: 0.78rem; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.02em; white-space: nowrap; }
        .gp-logo svg { width: 14px; height: 14px; fill: #fff; }
        .gp-platform { font-size: 0.72rem; font-weight: 700; color: #107c10; }
        .gp-badge { display: inline-block; background: #107c10; color: #fff; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin: 4px 4px 0 0; }
        .filter-label { font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .filter-label .hint { font-weight: 500; font-size: 0.75rem; color: #6b3b3b; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { border: 2px solid #2c2c2c; background: #fff; color: #2c2c2c; border-radius: 999px; padding: 5px 13px; font-size: 0.9rem; font-weight: 600; line-height: 1.2; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform 0.1s, background-color 0.15s; }
        .chip:hover { transform: translateY(-1px); }
        .chip .chip-icon { font-size: 1.15rem; line-height: 1; }
        .chip .chip-count { font-size: 0.72rem; color: #888; font-weight: 600; }
        .chip.active { background: #2c2c2c; color: #fff; }
        .chip.active .chip-count { color: #ff9b9b; }
        .chip.chip-gp { border-color: #107c10; color: #107c10; }
        .chip.chip-gp.active { background: #107c10; color: #fff; }
        .chip.chip-gp.active .chip-count { color: #c8f5c8; }
        .chip.chip-clear { border-style: dashed; color: #555; }
        .ai-rec { background: #2c2c2c; border-radius: 12px; padding: 16px; color: #fff; }
        .ai-rec .filter-label .hint { color: #ffb3b3; }
        .ai-rec .form-control { border: none; }
        .ai-rec .btn-rec { background: #ff4d4d; color: #fff; font-weight: 700; border: none; white-space: nowrap; }
        .ai-rec .btn-rec:hover { background: #e60000; color: #fff; }
        .rec-comment { margin: 12px 0 8px; font-weight: 600; color: #ffd0d0; }
        .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .rec-card { background: #fff; color: #2c2c2c; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; display: flex; flex-direction: column; }
        .rec-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
        .rec-card img { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; background: #1a1a1a; }
        .rec-card .rec-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .rec-card .rec-name { font-weight: 800; font-size: 0.98rem; }
        .rec-card .rec-reason { font-size: 0.82rem; color: #444; line-height: 1.45; flex: 1; }
        .rec-card .rec-go { font-size: 0.75rem; font-weight: 700; color: #ff4d4d; }
        .game-row.rec-highlight td { animation: recFlash 2.4s ease-out; }
        @keyframes recFlash { 0%, 40% { background-color: #ffe08a; } 100% { background-color: transparent; } }
        .game-summary { font-size: 0.8rem; color: #555; font-weight: 400; margin: 4px 0 2px; line-height: 1.5; word-break: keep-all; }
        .new-badge { background: #ff4d4d; color: #fff; font-size: 0.65rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="container-fluid container-wide py-5 px-3 px-md-4">
        <div class="text-center mb-5">
            <h1 class="site-title text-white d-flex align-items-center justify-content-center gap-3">
                <img src="logo.ico" alt="로고" style="height: 60px; width: auto;">
                해리야 할래말래
            </h1>
        </div>
        <div class="card mb-4 p-4">
            <div class="row g-3 align-items-end mb-3">
                <div class="col-md-9">
                    <label class="form-label fw-bold">🔍 단어 검색</label>
                    <input type="text" id="searchInput" class="form-control bg-light border-secondary" placeholder="제목/게임명/설명 검색..." oninput="onSearchInput()">
                </div>
                <div class="col-md-3 text-end">
                    <button onclick="randomPick()" class="btn btn-outline-warning fw-bold">🐚 소라고동</button>
                </div>
                <div id="liveStatus" class="col-12 text-end fw-bold"></div>
            </div>
            <div class="ai-rec mb-3">
                <div class="filter-label">🤖 AI 추천 <span class="hint">원하는 느낌을 말하면 목록 안에서 골라줘요 (이미 한 게임은 빼고)</span></div>
                <div class="input-group">
                    <input id="recInput" type="text" class="form-control" maxlength="200" placeholder="예: 친구 3명이랑 2시간 안에 끝나는 무서운 게임" onkeydown="if (event.key === 'Enter' && !event.isComposing) askRecommend()">
                    <button id="recBtn" class="btn btn-rec" onclick="askRecommend()">추천받기</button>
                </div>
                <div id="recResult"></div>
            </div>
            <div class="mb-1">
                <div class="filter-label">🎮 장르 <span class="hint">여러 개 고르면 하나라도 해당하는 게임이 보여요</span></div>
                <div id="genreChips" class="chip-row"></div>
            </div>
            <hr class="border-secondary my-3">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label fw-bold">🏷️ 카테고리</label>
                    <div id="tagFilters">
                        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="게임" checked onchange="applyFilters()"><label class="form-check-label fw-bold">게임</label></div>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="공겜" checked onchange="applyFilters()"><label class="form-check-label fw-bold text-danger">공겜</label></div>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="할 게임" checked onchange="applyFilters()"><label class="form-check-label fw-bold text-danger">할 게임</label></div>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="일단 킵" checked onchange="applyFilters()"><label class="form-check-label fw-bold text-primary">일단 킵</label></div>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="협동" checked onchange="applyFilters()"><label class="form-check-label fw-bold" style="color:#9b59b6;">협동</label></div>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="한 게임" onchange="applyFilters()"><label class="form-check-label fw-bold text-secondary" style="text-decoration: line-through;">한 게임</label></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">플타 (최대 <span id="timeVal">100</span>시간)</label>
                    <input type="range" class="form-range" id="timeRange" min="0" max="100" value="100" oninput="document.getElementById('timeVal').innerText=this.value; applyFilters()">
                </div>
            </div>
            <div id="syncStatus" class="sync-status text-end mt-2"></div>
        </div>
        <div id="errorMsg" class="alert alert-danger d-none"></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th style="width: 130px;">포스터</th>
                        <th style="width: 140px;">카테고리</th>
                        <th>제목</th>
                        <th>게임명 · AI설명</th>
                        <th>평가</th>
                        <th>가격/할인</th>
                        <th class="text-center">게임패스</th>
                        <th>한글 · 플타</th>
                        <th>링크</th>
                    </tr>
                </thead>
                <tbody id="gameTable">
                    <tr><td colspan="9" class="text-center py-5 text-muted">불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="trailerPreview" class="trailer-preview"><video muted loop playsinline></video><span class="trailer-label">▶ 트레일러</span></div>
    <div class="modal fade" id="conchModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-dark border-secondary"><div class="modal-header border-secondary"><h5 class="modal-title text-white">🐚 소라고동의 선택</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body text-center"><h2 class="text-warning mb-3" id="modalTitle">게임이름</h2><p id="modalInfo" class="text-white">이 게임 어때요?</p><div id="modalLinks" class="mt-3"></div></div></div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
    <script src="config.js"></script>
    <script>
        const CATEGORIES = ['게임', '공겜', '할 게임', '일단 킵', '협동', '한 게임'];
        const GENRES = ['액션', '어드벤처', 'RPG', '로그라이크', '전략', '시뮬레이션', '퍼즐', '공포', '생존', '슈팅',
            '플랫포머', '레이싱', '스포츠', '리듬', '격투', '샌드박스', '파티', '추리', '비주얼노벨', '카드', '방치형', '오픈월드', '힐링', '턴제'];
        const GENRE_ICON = {
            '액션': '⚔️', '어드벤처': '🧭', 'RPG': '🐉', '로그라이크': '🎲', '전략': '♟️', '시뮬레이션': '🏗️', '퍼즐': '🧩', '공포': '👻',
            '생존': '🏕️', '슈팅': '🔫', '플랫포머': '🍄', '레이싱': '🏎️', '스포츠': '⚽', '리듬': '🎵', '격투': '🥊', '샌드박스': '🧱',
            '파티': '🎉', '추리': '🕵️', '비주얼노벨': '📖', '카드': '🃏', '방치형': '⏳', '오픈월드': '🗺️', '힐링': '🌿', '턴제': '⏱️'
        };
        const XBOX_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a9.9 9.9 0 0 1 5.3 1.5c-1.8-.4-4 .9-5.3 2C10.7 4.4 8.5 3.1 6.7 3.5A9.9 9.9 0 0 1 12 2zm6.7 3c2 1.9 3.3 4.4 3.3 7.3 0 2.3-.8 4.5-2.2 6.2.6-2.6-2.4-7.6-4.7-10.4 1.4-1.6 2.7-2.9 3.6-3.1zM5.3 5c.9.2 2.2 1.5 3.6 3.1C6.6 10.9 3.6 15.9 4.2 18.5A9.9 9.9 0 0 1 2 12.3C2 9.4 3.3 6.9 5.3 5zM12 10.1c2.6 2.4 6.7 7.4 5.7 9.6A9.9 9.9 0 0 1 12 22a9.9 9.9 0 0 1-5.7-2.3c-1-2.2 3.1-7.2 5.7-9.6z"/></svg>';
        const selectedGenres = new Set();
        let gamepassOnly = false;
        const LOCAL_KEY = 'harry_categories';
        if (window.SUPABASE_URL) window.SUPABASE_URL = window.SUPABASE_URL.replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
        const useSupabase = !!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY);

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        // 카페 글에서 잘못 뽑힌 긴 값은 줄여서 보여주고, 마우스를 올리면 전체 표시
        const short = (v, n = 24) => {
            const t = String(v ?? '');
            return t.length > n ? `<span title="${esc(t)}">${esc(t.slice(0, n))}…</span>` : esc(t);
        };
        const safeUrl = u => /^https?:\/\//i.test(String(u)) ? String(u) : '';

        // CSV의 카테고리 표기('할게임', '일단킵' 등)를 필터 값으로 맞춤
        function normalizeCategory(c) {
            const s = String(c || '').replace(/\s/g, '');
            if (s.includes('한게임')) return '한 게임';
            if (s.includes('할')) return '할 게임';
            if (s.includes('킵')) return '일단 킵';
            if (s.includes('협동')) return '협동';
            if (s.includes('공겜')) return '공겜';
            return '게임';
        }

        function reviewClass(r) {
            r = String(r);
            if (r.includes('압도적으로 긍정')) return 'review-overwhelmingly-positive';
            if (r.includes('매우 긍정')) return 'review-very-positive';
            if (r.includes('대체로 긍정')) return 'review-mostly-positive';
            if (r.includes('긍정')) return 'review-positive';
            if (r.includes('대체로 부정')) return 'review-mostly-negative';
            if (r.includes('매우 부정')) return 'review-very-negative';
            if (r.includes('압도적으로 부정')) return 'review-overwhelmingly-negative';
            if (r.includes('부정')) return 'review-negative';
            return 'review-mixed';
        }

        // --- 카테고리 저장소 (Supabase 또는 브라우저 localStorage) ---
        function sbHeaders(extra) {
            const key = window.SUPABASE_ANON_KEY;
            // 레거시 anon 키(JWT)만 Authorization 헤더에 넣고, 새 publishable 키(sb_publishable_...)는 apikey만 사용
            return { apikey: key, ...(key.startsWith('eyJ') ? { Authorization: `Bearer ${key}` } : {}), ...extra };
        }
        async function loadOverrides() {
            if (useSupabase) {
                const res = await fetch(`${window.SUPABASE_URL}/rest/v1/categories?select=link,category`, { headers: sbHeaders() });
                if (!res.ok) throw new Error(`Supabase ${res.status}`);
                return Object.fromEntries((await res.json()).map(r => [r.link, r.category]));
            }
            try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; }
        }
        async function saveOverride(link, category) {
            if (useSupabase) {
                const res = await fetch(`${window.SUPABASE_URL}/rest/v1/categories`, {
                    method: 'POST',
                    headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' }),
                    body: JSON.stringify({ link, category, updated_at: new Date().toISOString() })
                });
                if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
                return;
            }
            try {
                const all = JSON.parse(localStorage.getItem(LOCAL_KEY)) || {};
                all[link] = category;
                localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
            } catch { throw new Error('브라우저 저장소를 사용할 수 없습니다'); }
        }

        // --- AI 장르/설명 (Supabase game_ai 테이블) ---
        async function loadAiInfo() {
            if (!useSupabase) return {};
            // Supabase는 한 번에 최대 1000행만 주므로 나눠서 끝까지 읽음
            const rows = [];
            for (let from = 0; ; from += 1000) {
                const res = await fetch(`${window.SUPABASE_URL}/rest/v1/game_ai?select=link,genres,summary`, { headers: sbHeaders({ Range: `${from}-${from + 999}` }) });
                if (!res.ok) break;
                const page = await res.json();
                rows.push(...page);
                if (page.length < 1000) break;
            }
            return Object.fromEntries(rows.map(r => [r.link, r]));
        }

        // app.py의 parse_time과 동일 (실시간으로 추가된 글용)
        function parseTime(text) {
            text = String(text ?? '').toLowerCase();
            const nums = text.match(/[-+]?\d*\.\d+|\d+/g);
            if (!nums) return 0;
            const avg = nums.map(Number).reduce((a, b) => a + b, 0) / nums.length;
            return (text.includes('분') || text.includes('min')) && !text.includes('시간') ? avg / 60 : avg;
        }
        const articleId = g => Number(String(g['게시글링크']).match(/articleid=(\d+)/)?.[1] || 0);

        // --- 렌더링 ---
        function renderRow(g, category) {
            const ai = aiInfo[g['게시글링크']] || {};
            const genres = ai.genres || [];
            const img = safeUrl(g['스팀이미지']);
            const link = safeUrl(g['링크']);
            const isSteam = link.includes('steampowered.com');
            const review = g['유저평가'] && g['유저평가'] !== '-'
                ? `<span class="review-badge ${reviewClass(g['유저평가'])}">${esc(g['유저평가'])}</span>`
                : '<span class="text-muted">-</span>';
            const discount = g['스팀할인'] > 0 ? `<span class="discount-badge">-${esc(g['스팀할인'])}%</span>` : '';
            const trailer = safeUrl(g['트레일러']);
            const options = CATEGORIES.map(c => `<option value="${c}"${c === category ? ' selected' : ''}>${c}</option>`).join('');
            const gp = g['게임패스'] && g['게임패스'] !== '-' ? g['게임패스'] : '';
            return `<tr class="game-row" data-id="${articleId(g)}" data-tag="${esc(category)}" data-time="${Number(g.time_num) || 0}" data-genres="${esc(genres.join(','))}" data-gp="${gp ? 1 : ''}" data-search="${esc([g['글제목'], g['게임이름'], ai.summary, ...genres].join(' ').toLowerCase())}">
                <td><div class="steam-img-container${trailer ? ' has-trailer' : ''}"${trailer ? ` data-trailer="${esc(trailer)}" data-poster="${esc(img)}"` : ''}>${img
                    ? `<img src="${esc(img)}" alt="포스터" class="steam-thumbnail" loading="lazy">`
                    : '<img src="logo.ico" alt="N/A" class="steam-thumbnail" style="opacity: 0.2; width: 40px;">'}</div></td>
                <td><select class="form-select form-select-custom" data-link="${esc(g['게시글링크'])}" onchange="changeCategory(this)">${options}</select></td>
                <td class="col-title">${g._live ? '<span class="new-badge">NEW</span>' : ''}<a href="${esc(safeUrl(g['게시글링크']))}" target="_blank" rel="noopener noreferrer" class="game-title">${esc(g['글제목'])}</a></td>
                <td class="fw-bold game-info"><span class="game-name">${esc(g['게임이름'])}</span>${ai.summary ? `<div class="game-summary">${esc(ai.summary)}</div>` : ''}<div>${genres.map(x => `<span class="genre-badge">${GENRE_ICON[x] || ''} ${esc(x)}</span>`).join('')}</div></td>
                <td class="text-center">${review}</td>
                <td class="fw-bold price-cell">${short(g['가격'])}${discount}</td>
                <td class="gp-cell">${gp ? `<span class="gp-mark" title="Xbox 게임패스에 포함"><span class="gp-logo">${XBOX_SVG}GAME PASS</span><span class="gp-platform">${esc(gp)}</span></span>` : '<span class="text-muted">-</span>'}</td>
                <td class="meta-cell"><div><span class="meta-label">한글</span>${short(g['한글화'], 12)}</div><div><span class="meta-label">플타</span>${short(g['플레이타임'], 14)}</div></td>
                <td class="store-link">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="btn btn-sm ${isSteam ? 'btn-dark' : 'btn-outline-info'} fw-bold">${isSteam ? 'Steam' : '구매'}</a>` : ''}</td>
            </tr>`;
        }

        function setStatus(msg, cls) {
            const el = document.getElementById('syncStatus');
            el.className = `sync-status text-end mt-2 ${cls || ''}`;
            el.innerText = msg;
        }

        let games = [], overrides = {}, aiInfo = {};

        function renderAll() {
            document.getElementById('gameTable').innerHTML = games
                .map(g => renderRow(g, normalizeCategory(overrides[g['게시글링크']] || g['카테고리'])))
                .join('');
            document.querySelectorAll('.form-select-custom').forEach(updateSelectColor);
            renderChips();
            applyFilters();
        }

        async function init() {
            try {
                const res = await fetch('games.json', { cache: 'no-cache' });
                games = await res.json();
            } catch (e) {
                const err = document.getElementById('errorMsg');
                err.innerText = '🚨 게임 목록(games.json)을 불러오지 못했습니다.';
                err.classList.remove('d-none');
                document.getElementById('gameTable').innerHTML = '';
                return;
            }
            try {
                [overrides, aiInfo] = await Promise.all([loadOverrides(), loadAiInfo().catch(() => ({}))]);
                setStatus(useSupabase ? '☁️ 카테고리 변경이 모두에게 공유됩니다' : '💾 카테고리 변경은 이 브라우저에만 저장됩니다');
            } catch (e) {
                console.error(e);
                setStatus('⚠️ 공유 카테고리를 불러오지 못했습니다 (기본값 표시 중)', 'text-danger fw-bold');
            }
            renderAll();
            fetchLive();
        }

        function updateSelectColor(selectElement) {
            const val = selectElement.value;
            selectElement.classList.remove('select-halgame', 'select-keep', 'select-coop', 'select-finished');
            if (val === '할 게임') selectElement.classList.add('select-halgame');
            else if (val === '일단 킵') selectElement.classList.add('select-keep');
            else if (val === '협동') selectElement.classList.add('select-coop');
            else if (val === '한 게임') selectElement.classList.add('select-finished');
        }

        function renderChips() {
            const counts = {};
            games.forEach(g => (aiInfo[g['게시글링크']]?.genres || []).forEach(x => counts[x] = (counts[x] || 0) + 1));
            const gpCount = games.filter(g => g['게임패스'] && g['게임패스'] !== '-').length;
            const chip = (cls, active, onclick, icon, label, count) =>
                `<button type="button" class="chip ${cls}${active ? ' active' : ''}" onclick="${onclick}"><span class="chip-icon">${icon}</span>${label}${count != null ? `<span class="chip-count">${count}</span>` : ''}</button>`;
            document.getElementById('genreChips').innerHTML =
                chip('chip-gp', gamepassOnly, 'toggleGamepass()', '🟩', 'Xbox 게임패스', gpCount) +
                GENRES.filter(x => counts[x]).map(x => chip('', selectedGenres.has(x), `toggleGenre('${x}')`, GENRE_ICON[x], x, counts[x])).join('') +
                (selectedGenres.size || gamepassOnly ? chip('chip-clear', false, 'clearGenres()', '✖', '초기화') : '');
        }
        function toggleGenre(x) { selectedGenres.has(x) ? selectedGenres.delete(x) : selectedGenres.add(x); renderChips(); applyFilters(); }
        function toggleGamepass() { gamepassOnly = !gamepassOnly; renderChips(); applyFilters(); }
        function clearGenres() { selectedGenres.clear(); gamepassOnly = false; renderChips(); applyFilters(); }

        // 한글 입력 중 글자마다 다시 거르지 않도록 잠깐 기다렸다가 적용
        let searchTimer = null;
        function onSearchInput() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(applyFilters, 120);
        }

        function applyFilters() {
            const timeLimit = parseFloat(document.getElementById('timeRange').value);
            const checkedTags = Array.from(document.querySelectorAll('#tagFilters input:checked')).map(cb => cb.value);
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

            document.querySelectorAll('.game-row').forEach(row => {
                let show = checkedTags.includes(row.getAttribute('data-tag'));
                if (parseFloat(row.getAttribute('data-time')) > timeLimit) show = false;
                if (selectedGenres.size && !row.dataset.genres.split(',').some(x => selectedGenres.has(x))) show = false;
                if (gamepassOnly && !row.dataset.gp) show = false;
                // 화면 텍스트(innerText)를 읽으면 행마다 레이아웃 계산이 일어나 느려서, 미리 만든 검색용 텍스트 사용
                if (show && searchText && !row.dataset.search.includes(searchText)) show = false;
                const display = show ? '' : 'none';
                if (row.style.display !== display) row.style.display = display;
            });
        }

        async function changeCategory(selectElement) {
            const row = selectElement.closest('tr');
            const prev = row.getAttribute('data-tag');
            const newCategory = selectElement.value;
            updateSelectColor(selectElement);
            row.setAttribute('data-tag', newCategory);
            applyFilters();
            try {
                await saveOverride(selectElement.dataset.link, newCategory);
            } catch (err) {
                console.error(err);
                alert('저장 실패: ' + err.message);
                selectElement.value = prev;
                updateSelectColor(selectElement);
                row.setAttribute('data-tag', prev);
                applyFilters();
            }
        }

        function randomPick() {
            const rows = Array.from(document.querySelectorAll('.game-row')).filter(r => r.style.display !== 'none');
            if (rows.length === 0) return alert('추천할 게임이 없어요! 필터를 확인해주세요.');
            const row = rows[Math.floor(Math.random() * rows.length)];
            const title = row.querySelector('.game-title').innerText;
            const gameName = row.querySelector('.game-name').innerText;
            const link = row.querySelector('.store-link a')?.href;
            document.getElementById('modalTitle').innerText = gameName !== '-' ? gameName : title;
            document.getElementById('modalInfo').innerText = row.querySelector('.game-summary')?.innerText || '이 게임 어때요?';
            document.getElementById('modalLinks').innerHTML = link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">상점 가기</a>` : '';
            new bootstrap.Modal(document.getElementById('conchModal')).show();
        }

        // --- 포스터 hover 시 트레일러 미리보기 ---
        const preview = document.getElementById('trailerPreview');
        const previewVideo = preview.querySelector('video');
        let hoverTimer = null, hls = null, activePoster = null;

        function showTrailer(poster) {
            const url = poster.dataset.trailer;
            previewVideo.poster = poster.dataset.poster || '';
            if (window.Hls && Hls.isSupported()) {
                hls = new Hls({ capLevelToPlayerSize: true, startLevel: 2, maxBufferLength: 10 });
                hls.loadSource(url);
                hls.attachMedia(previewVideo);
            } else if (previewVideo.canPlayType('application/vnd.apple.mpegurl')) {
                previewVideo.src = url;  // Safari는 HLS 기본 지원
            } else return;
            previewVideo.play().catch(() => {});

            const r = poster.getBoundingClientRect();
            const w = preview.offsetWidth, h = preview.offsetHeight, gap = 12;
            let left = r.right + gap;
            if (left + w > window.innerWidth - 16) left = Math.max(16, r.left - w - gap);
            const top = Math.min(Math.max(16, r.top + r.height / 2 - h / 2), window.innerHeight - h - 16);
            preview.style.left = `${left}px`;
            preview.style.top = `${top}px`;
            preview.style.transformOrigin = left > r.left ? 'left center' : 'right center';
            preview.classList.add('show');
        }

        function hideTrailer() {
            clearTimeout(hoverTimer);
            activePoster = null;
            preview.classList.remove('show');
            if (hls) { hls.destroy(); hls = null; }
            previewVideo.pause();
            previewVideo.removeAttribute('src');
            previewVideo.load();
        }

        if (window.matchMedia('(hover: hover)').matches) {
            const table = document.getElementById('gameTable');
            table.addEventListener('mouseover', e => {
                const poster = e.target.closest('.has-trailer');
                if (!poster || poster === activePoster) return;
                hideTrailer();
                activePoster = poster;
                hoverTimer = setTimeout(() => showTrailer(poster), 350);
            });
            table.addEventListener('mouseout', e => {
                const poster = e.target.closest('.has-trailer');
                if (poster && !poster.contains(e.relatedTarget)) hideTrailer();
            });
            window.addEventListener('scroll', hideTrailer, { passive: true });
        }

        // --- 접속(F5)할 때마다 카페 최신 글 + AI 정보 가져오기 (Supabase Edge Function) ---
        // --- AI 추천 ---
        async function askRecommend() {
            const input = document.getElementById('recInput');
            const btn = document.getElementById('recBtn');
            const box = document.getElementById('recResult');
            const query = input.value.trim();
            if (!query) return input.focus();
            if (!useSupabase) return box.innerHTML = '<div class="rec-comment">Supabase 설정이 필요해요.</div>';
            btn.disabled = true;
            box.innerHTML = '<div class="rec-comment">🤔 820개 목록에서 고르는 중... (5~15초)</div>';
            try {
                const res = await fetch(`${window.SUPABASE_URL}/functions/v1/live-games`, {
                    method: 'POST', headers: sbHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ recommend: query })
                });
                const data = await res.json().catch(() => ({ status: 'error', msg: `HTTP ${res.status}` }));
                if (data.status !== 'ok') throw new Error(data.msg);
                if (!Array.isArray(data.picks)) throw new Error('추천 기능을 준비 중이에요. 잠시 뒤 다시 시도해 주세요');
                const byId = new Map(games.map(g => [String(articleId(g)), g]));
                const cards = data.picks.map(p => {
                    const g = byId.get(String(p.id));
                    if (!g) return '';
                    const img = safeUrl(g['스팀이미지']);
                    const genres = (aiInfo[g['게시글링크']]?.genres || []).map(x => `<span class="genre-badge">${GENRE_ICON[x] || ''} ${esc(x)}</span>`).join('');
                    return `<div class="rec-card" onclick="goToGame('${esc(p.id)}')">
                        <img src="${img ? esc(img) : 'logo.ico'}" alt="" loading="lazy"${img ? '' : ' style="object-fit: contain; opacity: 0.3;"'}>
                        <div class="rec-body"><div class="rec-name">${esc(g['게임이름'])}</div><div>${genres}</div>
                        <div class="rec-reason">${esc(p.reason)}</div><div class="rec-go">표에서 보기 →</div></div></div>`;
                }).join('');
                box.innerHTML = `<div class="rec-comment">${esc(data.comment)}</div>` + (cards ? `<div class="rec-grid">${cards}</div>` : '<div>딱 맞는 게임을 못 찾았어요. 조금 다르게 말해 볼래요?</div>');
            } catch (err) {
                console.error(err);
                box.innerHTML = `<div class="rec-comment">🚨 ${esc(err.message || '추천 실패')}</div>`;
            }
            btn.disabled = false;
        }

        // 추천 카드 클릭: 필터에 가려져 있으면 필터를 풀고 해당 행으로 이동
        function goToGame(id) {
            const row = document.querySelector(`.game-row[data-id="${CSS.escape(String(id))}"]`);
            if (!row) return;
            if (row.style.display === 'none') {
                document.getElementById('searchInput').value = '';
                document.querySelectorAll('#tagFilters input').forEach(cb => { if (cb.value === row.dataset.tag) cb.checked = true; });
                document.getElementById('timeRange').value = 100;
                document.getElementById('timeVal').innerText = '100';
                clearGenres();
            }
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            row.classList.remove('rec-highlight');
            void row.offsetWidth;
            row.classList.add('rec-highlight');
        }

        function setLiveStatus(msg, cls) {
            const el = document.getElementById('liveStatus');
            el.className = `col-12 text-end fw-bold ${cls || ''}`;
            el.innerText = msg;
        }

        async function fetchLive() {
            if (!useSupabase) return;
            setLiveStatus('🔄 카페 최신 글 확인 중...');
            try {
                const res = await fetch(`${window.SUPABASE_URL}/functions/v1/live-games`, {
                    method: 'POST', headers: sbHeaders({ 'Content-Type': 'application/json' }), body: '{}'
                });
                const data = await res.json().catch(() => ({ status: 'error', msg: `HTTP ${res.status}` }));
                if (data.status !== 'ok') throw new Error(data.msg || `HTTP ${res.status}`);
                const known = new Set(games.map(g => g['게시글링크']));
                const fresh = data.games.filter(g => !known.has(g['게시글링크']))
                    .map(g => ({ ...g, time_num: parseTime(g['플레이타임']), _live: true }));
                if (fresh.length || data.ai_filled) {
                    aiInfo = await loadAiInfo().catch(() => aiInfo);
                    games = [...fresh, ...games].sort((a, b) => articleId(b) - articleId(a));
                    renderAll();
                }
                const parts = [fresh.length ? `✨ 카페 새 글 ${fresh.length}개 추가됨` : '✅ 카페 최신 글까지 반영됨'];
                if (data.ai_remaining > 0) parts.push(`🤖 장르·설명 채우는 중 (남은 ${data.ai_remaining}개 · 새로고침할 때마다 이어서 채워져요)`);
                setLiveStatus(parts.join(' · '));
            } catch (err) {
                console.error(err);
                setLiveStatus('⚠️ 카페 최신 글을 불러오지 못했어요 (저장된 목록 표시 중)', 'text-danger');
            }
        }

        init();
    </script>
</body>
</html>

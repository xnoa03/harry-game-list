name: 게임 데이터 자동 갱신

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 (UTC 기준)
  workflow_dispatch:
    inputs:
      pages:
        description: '탐색할 페이지 수 (1페이지 = 글 50개)'
        default: '3'
      trailers:
        description: '트레일러를 수집할 최대 게임 수'
        default: '150'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 크롤링 + 트레일러 수집 + games.json 생성
        run: python build_site.py --crawl ${{ github.event.inputs.pages || '3' }} --trailers ${{ github.event.inputs.trailers || '150' }}

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harry_game_list_final.csv docs/games.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          fi
